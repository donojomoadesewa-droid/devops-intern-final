name: CI/CD

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: "./scripts"

      - name: Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: app/Dockerfile

  build:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            --build-arg BUILD_SHA=${{ github.sha }} \
            -t nginx-app:${{ github.sha }} \
            ./app

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Build test image
        run: |
          docker build \
            --build-arg BUILD_SHA=${{ github.sha }} \
            -t nginx-app:test \
            ./app

      - name: Run container
        run: |
          docker run -d -p 8080:8080 --name nginx-test nginx-app:test

      - name: Health check
        run: |
          chmod +x scripts/healthcheck.sh
          ./scripts/healthcheck.sh

      - name: Stop container
        if: always()
        run: docker rm -f nginx-test

  publish:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/nginx-app

          docker build \
            --build-arg BUILD_SHA=${{ github.sha }} \
            -t $IMAGE:${{ github.sha }} \
            -t $IMAGE:latest \
            ./app

          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest